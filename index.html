<!DOCTYPE html>
<html>
<head>
  <title>Autonomous SRE Demo</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 16px 0; }
    .ok { color: #059669; font-weight: bold; }
    .err { color: #dc2626; font-weight: bold; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Autonomous SRE Demo</h1>
  <p>Multi-agent self-healing ECS deployment</p>

  <div class="card">
    <h2>Frontend (this service)</h2>
    <p class="ok">✓ Healthy — Python Flask on ECS Fargate</p>
  </div>

  <div class="card">
    <h2>Backend API status</h2>
    <div id="status">Checking...</div>
  </div>

  <script>
    fetch("/api/backend-status")
      .then(r => r.json())
      .then(d => {
        document.getElementById("status").innerHTML =
          d.status === "healthy"
            ? '<span class="ok">✓ Healthy — ' + (d.message || d.service) + '</span>'
            : '<span class="err">✗ ' + (d.error || d.status) + '</span>';
      })
      .catch(e => {
        document.getElementById("status").innerHTML =
          '<span class="err">✗ ' + e.message + '</span>';
      });
  </script>
</body>
</html>
