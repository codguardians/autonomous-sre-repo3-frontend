name: Frontend CI/CD — Autonomous SRE

on:
  push:
    branches: [main, "fix/*"]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  SERVICE_NAME: autonomous-sre-frontend
  CLUSTER_NAME: autonomous-sre-cluster

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # ── Stage 1: Dependency Prediction ────────────────────────────────────────
  dependency-prediction:
    name: "Stage 1 · Dependency Prediction"
    runs-on: ubuntu-latest
    outputs:
      ecr_url: ${{ steps.ecr.outputs.ecr_url }}
      safe_to_proceed: ${{ steps.predict.outputs.safe_to_proceed }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::160071257600:role/CICD-codguardians"
          role-session-name: GitHubActions-Backend-${{ github.run_id }}
          aws-region: "us-east-1"

      - name: Get ECR URL from Repo 2 state
        id: ecr
        run: |
          pip install boto3 --quiet
          python3 - <<'PYEOF'
          import boto3, json, os
          try:
              s3 = boto3.client("s3", region_name="us-east-1")
              obj = s3.get_object(Bucket="autonomous-sre-tfstate", Key="app-infra/terraform.tfstate")
              state = json.loads(obj["Body"].read())
              ecr_url = state.get("outputs", {}).get("frontend_ecr_url", {}).get("value", "")
              print(f"ECR URL: {ecr_url}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"ecr_url={ecr_url}\n")
          except Exception as e:
              print(f"State read failed: {e}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("ecr_url=\n")
          PYEOF

      - name: Claude dependency prediction
        id: predict
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          ecr_url = """${{ steps.ecr.outputs.ecr_url }}""".strip()
          safe = bool(ecr_url)
          prompt = f"""Dependency check for repo3-frontend (Python Flask on ECS).
          Depends on repo2-app-infra for ECR URL. ECR URL: {ecr_url or 'MISSING'}.
          JSON only: {{"safe_to_proceed": {str(safe).lower()}, "risk_level": "LOW", "summary": "frontend flask deploy", "warnings": {json.dumps([] if safe else ["ECR URL missing — repo2 must deploy first"])}}}"""
          payload = json.dumps({"model": "claude-sonnet-4-20250514", "max_tokens": 300,
              "messages": [{"role": "user", "content": prompt}]}).encode()
          req = urllib.request.Request("https://api.anthropic.com/v1/messages", data=payload,
              headers={"Content-Type": "application/json",
                       "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                       "anthropic-version": "2023-06-01"})
          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())
          text = data["content"][0]["text"].strip()
          if "```" in text:
              text = text.split("```")[1]
              if text.startswith("json"): text = text[4:]
          result = json.loads(text.strip())
          print(json.dumps(result, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"safe_to_proceed={str(result.get('safe_to_proceed', safe)).lower()}\n")
          PYEOF

  # ── Stage 2: Build & Push ECR ─────────────────────────────────────────────
  build-push:
    name: "Stage 2 · Build & Push ECR"
    runs-on: ubuntu-latest
    needs: dependency-prediction
    if: needs.dependency-prediction.outputs.safe_to_proceed != 'false'
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::160071257600:role/CICD-codguardians"
          role-session-name: GitHubActions-Backend-${{ github.run_id }}
          aws-region: "us-east-1"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: push
        run: |
          ECR="${{ needs.dependency-prediction.outputs.ecr_url }}"
          TAG="${{ github.sha }}"
          IMAGE="${ECR}:${TAG}"
          docker build -t "$IMAGE" .
          docker tag "$IMAGE" "${ECR}:latest"
          docker push "$IMAGE"
          docker push "${ECR}:latest"
          echo "image_uri=$IMAGE" >> $GITHUB_OUTPUT
          echo "Pushed: $IMAGE"

  # ── Stage 3: Self-Heal on build failure ───────────────────────────────────
  self-heal:
    name: "Stage 3 · Self-Heal"
    runs-on: ubuntu-latest
    needs: [dependency-prediction, build-push]
    if: failure() 
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Claude diagnose and fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          dockerfile = open("Dockerfile").read() if os.path.exists("Dockerfile") else ""
          reqs = open("requirements.txt").read() if os.path.exists("requirements.txt") else ""
          apppy = open("app.py").read() if os.path.exists("app.py") else ""

          prompt = f"""Fix a Docker build or runtime failure for a Python Flask app on ECS Fargate.
          Dockerfile:\n{dockerfile}
          requirements.txt:\n{reqs}
          app.py:\n{apppy}
          Common issues: wrong port, missing dependency, gunicorn command wrong.
          JSON only: {{"root_cause": "...", "fix_description": "...", "file_patches": [{{"filename": "Dockerfile", "search": "...", "replace": "..."}}], "commit_message": "fix: ..."}}"""

          payload = json.dumps({"model": "claude-sonnet-4-20250514", "max_tokens": 1000,
              "messages": [{"role": "user", "content": prompt}]}).encode()
          req = urllib.request.Request("https://api.anthropic.com/v1/messages", data=payload,
              headers={"Content-Type": "application/json",
                       "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                       "anthropic-version": "2023-06-01"})
          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())
          text = data["content"][0]["text"].strip()
          if "```" in text:
              text = text.split("```")[1]
              if text.startswith("json"): text = text[4:]
          fix = json.loads(text.strip())
          print(json.dumps(fix, indent=2))

          for patch in fix.get("file_patches", []):
              fn = patch["filename"]
              if os.path.exists(fn):
                  with open(fn) as fp: c = fp.read()
                  if patch.get("search", "") in c:
                      with open(fn, "w") as fp:
                          fp.write(c.replace(patch["search"], patch["replace"], 1))

          with open("/tmp/commit_msg.txt", "w") as fp:
              fp.write(fix.get("commit_message", "fix: auto-heal frontend"))
          with open("/tmp/root_cause.txt", "w") as fp:
              fp.write(fix.get("root_cause", "unknown"))
          PYEOF

          BRANCH="fix/auto-heal-frontend-$(date +%Y%m%d-%H%M%S)"
          git config user.name "Autonomous SRE Bot"
          git config user.email "sre-bot@autonomous-sre.io"
          git checkout -b "$BRANCH"
          git add -A
          git diff --staged --quiet || git commit -m "$(cat /tmp/commit_msg.txt)"
          git push origin "$BRANCH"
          gh pr create \
            --title "Auto-heal frontend: $(cat /tmp/commit_msg.txt)" \
            --body "Root cause: $(cat /tmp/root_cause.txt)" \
            --head "$BRANCH" --base main --label "auto-heal" || true

  # ── Stage 4: Deploy to ECS ────────────────────────────────────────────────
  deploy:
    name: "Stage 4 · Deploy to ECS"
    runs-on: ubuntu-latest
    needs: [dependency-prediction, build-push]
    if: github.ref == 'refs/heads/main'
    outputs:
      deploy_status: ${{ steps.deploy.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::160071257600:role/CICD-codguardians"
          role-session-name: GitHubActions-Backend-${{ github.run_id }}
          aws-region: "us-east-1"

      - name: Register new task definition and deploy
        id: deploy
        run: |
          ECR="${{ needs.dependency-prediction.outputs.ecr_url }}"
          TAG="${{ github.sha }}"
          IMAGE="${ECR}:${TAG}"
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --query 'LoadBalancers[?contains(LoadBalancerName,`autonomous-sre`)].DNSName' \
            --output text)
          EXEC_ROLE=$(aws iam get-role \
            --role-name autonomous-sre-ecs-execution-role \
            --query 'Role.Arn' --output text)

          # Register task def with correct Python env vars (not Next.js)
          NEW_ARN=$(aws ecs register-task-definition \
            --family autonomous-sre-frontend \
            --network-mode awsvpc \
            --requires-compatibilities FARGATE \
            --cpu 256 --memory 512 \
            --execution-role-arn "$EXEC_ROLE" \
            --container-definitions "[{
              \"name\": \"frontend\",
              \"image\": \"${IMAGE}\",
              \"essential\": true,
              \"portMappings\": [{\"containerPort\": 3000, \"protocol\": \"tcp\"}],
              \"environment\": [
                {\"name\": \"PORT\", \"value\": \"3000\"},
                {\"name\": \"BACKEND_API_URL\", \"value\": \"http://${ALB_DNS}\"}
              ],
              \"logConfiguration\": {
                \"logDriver\": \"awslogs\",
                \"options\": {
                  \"awslogs-group\": \"/ecs/autonomous-sre\",
                  \"awslogs-region\": \"us-east-1\",
                  \"awslogs-stream-prefix\": \"frontend\"
                }
              },
              \"healthCheck\": {
                \"command\": [\"CMD-SHELL\", \"curl -f http://localhost:3000/api/health || exit 1\"],
                \"interval\": 30,
                \"timeout\": 10,
                \"retries\": 3,
                \"startPeriod\": 60
              }
            }]" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "Registered: $NEW_ARN"

          aws ecs update-service \
            --cluster "${{ env.CLUSTER_NAME }}" \
            --service "${{ env.SERVICE_NAME }}" \
            --task-definition "$NEW_ARN"

          echo "Waiting for stability..."
          set +e
          aws ecs wait services-stable \
            --cluster "${{ env.CLUSTER_NAME }}" \
            --services "${{ env.SERVICE_NAME }}"
          CODE=$?
          echo "status=$([ $CODE -eq 0 ] && echo success || echo failed)" >> $GITHUB_OUTPUT
          exit $CODE

